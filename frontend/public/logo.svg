<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Digital Twin Network Grid / Nodes -->
  <circle cx="28" cy="30" r="3" fill="#38BDF8" opacity="0.7" />
  <circle cx="72" cy="30" r="3" fill="#38BDF8" opacity="0.7" />
  <circle cx="20" cy="55" r="2.5" fill="#60A5FA" opacity="0.5" />
  <circle cx="80" cy="55" r="2.5" fill="#60A5FA" opacity="0.5" />
  <circle cx="28" cy="80" r="3" fill="#38BDF8" opacity="0.7" />
  <circle cx="72" cy="80" r="3" fill="#38BDF8" opacity="0.7" />

  <!-- Connecting data links -->
  <line x1="28" y1="30" x2="50" y2="18" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.4" />
  <line x1="72" y1="30" x2="50" y2="18" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.4" />
  <line x1="28" y1="80" x2="20" y2="55" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.3" />
  <line x1="72" y1="80" x2="80" y2="55" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.3" />

  <!-- Building Geometric Silhouette -->
  <!-- Left Wing -->
  <path d="M 28 42 L 44 32 L 44 82 L 28 82 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <!-- Center Main Tower -->
  <path d="M 44 24 L 56 24 L 56 82 L 44 82 Z" fill="#334155" stroke="#64748B" stroke-width="1.5" />
  <!-- Right Wing -->
  <path d="M 56 32 L 72 42 L 72 82 L 56 82 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5" />

  <!-- Building Windows / Sensor Nodes -->
  <rect x="32" y="48" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />
  <rect x="38" y="48" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />
  <rect x="32" y="58" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />
  <rect x="38" y="58" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />
  <rect x="32" y="68" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />
  <rect x="38" y="68" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />

  <rect x="60" y="48" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />
  <rect x="66" y="48" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />
  <rect x="60" y="58" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />
  <rect x="66" y="58" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />
  <rect x="60" y="68" width="4" height="4" rx="1" fill="#93C5FD" opacity="0.7" />
  <rect x="66" y="68" width="4" height="4" rx="1" fill="#38BDF8" opacity="0.8" />

  <!-- Center Energy Twin Lightning Bolt Over Tower -->
  <path d="M 53 14 L 42 44 L 51 44 L 46 72 L 62 38 L 52 38 Z"
        fill="url(#boltGrad)"
        filter="drop-shadow(0 0 8px rgba(56, 189, 248, 0.8))" />
</svg>
